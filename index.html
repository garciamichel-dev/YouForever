    <script>
      // Suppress benign Vite HMR WebSocket warnings and iframe media permission restrictions
      window.addEventListener('error', function(e) {
        var msg = String((e && e.message) || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('not allowed by the user agent') ||
          msg.includes('Error starting media recorder') ||
          (e && e.filename && e.filename.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e && e.reason ? (e.reason.stack || e.reason.message || e.reason) : '');
        if (
          str.includes('WebSocket') ||
          str.includes('@vite/client') ||
          str.includes('createWebSocketModuleRunnerTransport') ||
          str.includes('not allowed by the user agent') ||
          str.includes('Error starting media recorder') ||
          str.includes('token-service-api') ||
          str.includes('securetoken.googleapis.com')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
